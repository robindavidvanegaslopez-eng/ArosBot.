
name: Build ArosBot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o ArosBot-proyecto-inicial.zip -d extracted

      - name: Build APK
        working-directory: extracted/ArosBot
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ArosBot-debug-apk
          path: extracted/ArosBot/app/build/outputs/apk/debug/app-debug.apk
          
